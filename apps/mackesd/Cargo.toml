[package]
name = "mackesd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mackes-config = { path = "../../crates/config" }
mackes-domain = { path = "../../crates/domain" }
mackes-ipc = { path = "../../crates/ipc" }
mackes-midi-engine = { path = "../../crates/midi-engine", features = ["midir-backend", "alsa-seq-backend"] }
mackes-pipedal-adapter = { path = "../../crates/pipedal-adapter" }
mackes-profiles = { path = "../../crates/profiles" }
mackes-scene-engine = { path = "../../crates/scene-engine" }
serde_json.workspace = true
signal-hook.workspace = true

[lints]
workspace = true

[features]
default = ["alsa-seq-backend"]
alsa-seq-backend = []

[[bin]]
name = "mackes-midi-matrixd"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
